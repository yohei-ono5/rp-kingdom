<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Samples — The Kingdom Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f2e6cf;
      --ink: #1b1a17;
      --ink-soft: rgba(27, 26, 23, 0.62);
      --gold: #c9a227;
      --serif: 'Cormorant Garamond', 'Noto Serif JP', Georgia, serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Noto Serif JP', Georgia, serif;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 22% 12%, rgba(255, 255, 255, 0.55), transparent 58%),
        radial-gradient(ellipse at 82% 78%, rgba(196, 168, 118, 0.28), transparent 62%),
        var(--paper);
    }

    #lab-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
    }

    #labels {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .lab-label {
      position: absolute;
      top: 0;
      left: 0;
      white-space: nowrap;
      font-family: var(--serif);
      font-size: 13px;
      letter-spacing: 0.14em;
      color: var(--ink);
      background: rgba(242, 230, 207, 0.82);
      border-bottom: 1px solid var(--gold);
      padding: 4px 12px 5px;
      transition: opacity 0.3s ease;
    }

    .lab-label.is-existing {
      border-bottom-color: rgba(27, 26, 23, 0.3);
      color: var(--ink-soft);
    }

    .lab-head {
      position: fixed;
      top: 22px;
      left: 28px;
      z-index: 20;
      max-width: 420px;
    }

    .lab-head h1 {
      margin: 0 0 6px;
      font-family: var(--serif);
      font-weight: 500;
      font-size: 30px;
      letter-spacing: 0.02em;
    }

    .lab-head p {
      margin: 0;
      font-size: 12px;
      line-height: 1.9;
      color: var(--ink-soft);
    }

    .lab-hint {
      position: fixed;
      bottom: 22px;
      left: 28px;
      z-index: 20;
      font-family: var(--serif);
      font-size: 11px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="lab-canvas"></canvas>
  <div id="labels"></div>

  <div class="lab-head">
    <h1>Procedural Samples</h1>
    <p>
      手続き生成の見本。左端が既存の購入モデル、右がコードで生成したものです。
      本編と同じライティングとアートディレクション層を通しています。
    </p>
  </div>

  <div class="lab-hint">Drag to orbit &nbsp;·&nbsp; Wheel to zoom</div>

  <script type="module" src="./assets/js/procedural/lab.js"></script>
</body>
</html>
