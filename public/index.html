<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RP Kingdom</title>
  <style>
    :root {
      --nav-bg: rgba(20, 16, 40, 0.55);
      --nav-bg-hover: rgba(40, 30, 65, 0.75);
      --nav-bg-active: rgba(196, 230, 255, 0.18);
      --nav-border: rgba(255, 220, 140, 0.25);
      --nav-border-active: rgba(170, 225, 255, 0.65);
      --nav-text: #f7eac0;
      --nav-text-active: #d9f5ff;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
    }

    body.intro-active #top-nav,
    body.intro-active #hud-note,
    body.intro-active #house-tooltip,
    body.intro-active #tod-widget,
    body.intro-active #plot-panel {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    canvas {
      display: block;
    }

    #top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 28px;
      color: #f4ead0;
      font-family: Georgia, serif;
      pointer-events: none;
    }

    #top-nav * {
      pointer-events: auto;
    }

    .nav-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-brand {
      font-size: 18px;
      letter-spacing: 0.08em;
      font-weight: bold;
    }

    .nav-caption {
      font-size: 11px;
      letter-spacing: 0.18em;
      color: rgba(244, 234, 208, 0.7);
    }

    .nav-right {
      display: flex;
      gap: 10px;
    }

    #view-nav {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      background: rgba(20, 16, 40, 0.55);
      color: #f7eac0;
      border: 1px solid rgba(255, 220, 140, 0.25);
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 13px;
      letter-spacing: 0.06em;
      backdrop-filter: blur(8px);
      transition:
        background 180ms ease,
        border-color 180ms ease,
        color 180ms ease,
        transform 180ms ease;
    }

    .nav-btn:hover {
      background: var(--nav-bg-hover);
      transform: translateY(-1px);
    }

    .nav-btn.is-active {
      background: var(--nav-bg-active);
      border-color: var(--nav-border-active);
      color: var(--nav-text-active);
    }

    #hud-note {
      position: fixed;
      left: 28px;
      bottom: 24px;
      z-index: 1200;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(12, 14, 24, 0.35);
      color: rgba(250, 241, 220, 0.82);
      font: 12px/1.4 Georgia, serif;
      letter-spacing: 0.05em;
      backdrop-filter: blur(6px);
      pointer-events: none;
      transition:
        opacity 180ms ease,
        transform 180ms ease;
    }

    #hud-note.is-map {
      color: #d9f5ff;
      border-color: rgba(170, 225, 255, 0.3);
      background: rgba(18, 31, 40, 0.42);
    }

    #house-tooltip {
      position: fixed;
      z-index: 1600;
      min-width: 120px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 220, 140, 0.28);
      background: rgba(20, 16, 40, 0.9);
      color: #fff4d8;
      font-family: Georgia, serif;
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(8px);
      pointer-events: none;
      opacity: 0;
      transform: translate3d(0, 8px, 0) scale(0.98);
      transition:
        opacity 150ms ease,
        transform 150ms ease;
    }

    #house-tooltip.is-visible {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }

    .house-tooltip-label {
      display: block;
      margin-bottom: 2px;
      color: #ffe7a8;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.08em;
    }

    .house-tooltip-name {
      display: block;
      color: rgba(255, 244, 216, 0.76);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #tod-widget {
      position: fixed;
      top: 74px;
      left: 50%;
      z-index: 1500;
      min-width: 174px;
      padding: 8px 14px;
      border: 1px solid rgba(255, 220, 140, 0.22);
      border-radius: 999px;
      background: rgba(12, 14, 24, 0.34);
      color: rgba(255, 245, 220, 0.88);
      font-family: Georgia, serif;
      text-align: center;
      transform: translateX(-50%);
      backdrop-filter: blur(8px);
      pointer-events: none;
      transition:
        opacity 180ms ease,
        visibility 180ms ease;
    }

    #tod-clock {
      display: block;
      font-size: 12px;
      line-height: 1.2;
      letter-spacing: 0.08em;
    }

    #tod-label {
      display: block;
      margin-top: 2px;
      color: rgba(217, 245, 255, 0.76);
      font-size: 10px;
      line-height: 1.2;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    #plot-panel {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 1600;
      width: min(260px, calc(100vw - 48px));
      padding: 16px 18px;
      border: 1px solid rgba(126, 76, 24, 0.34);
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(255, 247, 218, 0.96), rgba(229, 204, 148, 0.96));
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.3);
      color: #4b2b0b;
      font-family: Georgia, serif;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translate3d(0, 8px, 0);
      transition:
        opacity 160ms ease,
        visibility 160ms ease,
        transform 160ms ease;
    }

    #plot-panel.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translate3d(0, 0, 0);
    }

    .plot-panel-status {
      display: inline-block;
      margin-bottom: 9px;
      padding: 3px 9px;
      border-radius: 999px;
      background: #b83218;
      color: #fff7e2;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.12em;
    }

    .plot-panel-id {
      margin-bottom: 3px;
      color: rgba(75, 43, 11, 0.64);
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .plot-panel-title {
      margin-bottom: 5px;
      color: #3d2309;
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 0.04em;
    }

    .plot-panel-price {
      margin-bottom: 5px;
      color: #b83218;
      font-size: 14px;
      font-weight: bold;
    }

    .plot-panel-size,
    .plot-panel-desc {
      color: rgba(75, 43, 11, 0.72);
      font-size: 11px;
      line-height: 1.5;
    }

    #intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 4200;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 14% 18%, rgba(238, 246, 255, 0.88), transparent 24%),
        radial-gradient(circle at 84% 14%, rgba(179, 209, 238, 0.56), transparent 22%),
        radial-gradient(circle at 76% 76%, rgba(204, 226, 245, 0.42), transparent 26%),
        linear-gradient(180deg, #d8e5f3 0%, #e5eef7 24%, #edf3f9 54%, #dde8f4 100%);
      transition:
        opacity 1100ms ease,
        visibility 1100ms ease;
    }

    #intro-overlay::before,
    #intro-overlay::after {
      content: "";
      position: absolute;
      inset: -12%;
      background:
        radial-gradient(ellipse at 18% 26%, rgba(255, 255, 255, 0.95), transparent 20%),
        radial-gradient(ellipse at 34% 18%, rgba(255, 255, 255, 0.84), transparent 18%),
        radial-gradient(ellipse at 76% 24%, rgba(244, 249, 255, 0.8), transparent 22%),
        radial-gradient(ellipse at 64% 68%, rgba(233, 242, 251, 0.7), transparent 24%),
        radial-gradient(ellipse at 28% 80%, rgba(243, 248, 254, 0.74), transparent 22%);
      filter: blur(52px);
      animation: introCloudDrift 16s ease-in-out infinite alternate;
    }

    #intro-overlay::after {
      animation-duration: 20s;
      animation-direction: alternate-reverse;
      opacity: 0.58;
    }

    #intro-overlay.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-panel {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      text-align: center;
      color: #3059a5;
      font-family: Georgia, serif;
      letter-spacing: 0.16em;
      text-shadow: 0 8px 24px rgba(255, 255, 255, 0.42);
    }

    .intro-mark {
      width: 118px;
      height: 118px;
      display: grid;
      place-items: center;
      background: #2d57a5;
      color: #ffffff;
      box-shadow: 0 24px 48px rgba(55, 92, 148, 0.16);
    }

    .intro-mark-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transform: translateY(-2px);
    }

    .intro-crown {
      font-size: 30px;
      line-height: 1;
      letter-spacing: 0;
    }

    .intro-mark-copy {
      font-size: 10px;
      line-height: 1.2;
      letter-spacing: 0.16em;
      white-space: pre-line;
    }

    .intro-title {
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 0.28em;
      color: #3e67b3;
      text-transform: uppercase;
      text-shadow: 0 4px 14px rgba(255, 255, 255, 0.6);
    }

    .intro-enter {
      min-width: 148px;
      padding: 12px 24px;
      border: 1px solid rgba(62, 103, 179, 0.82);
      background: rgba(255, 255, 255, 0.4);
      color: #3e67b3;
      font-family: Georgia, serif;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        background 180ms ease,
        transform 180ms ease,
        box-shadow 180ms ease;
    }

    .intro-enter:hover {
      background: rgba(255, 255, 255, 0.74);
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(70, 109, 181, 0.14);
    }

    .intro-hint {
      font-size: 10px;
      color: rgba(62, 103, 179, 0.72);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    @keyframes introCloudDrift {
      0% {
        transform: translate3d(-20px, -14px, 0) scale(1.01);
      }
      100% {
        transform: translate3d(18px, 16px, 0) scale(1.06);
      }
    }

    @media (max-width: 720px) {
      #top-nav {
        padding: 16px 18px;
        align-items: flex-start;
        gap: 14px;
        flex-direction: column;
      }

      .nav-right {
        width: 100%;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .nav-btn {
        white-space: nowrap;
      }

      #hud-note {
        left: 18px;
        right: 18px;
        bottom: 18px;
        border-radius: 18px;
      }

      #tod-widget {
        top: 126px;
      }

      #plot-panel {
        right: 18px;
        bottom: 76px;
        width: calc(100vw - 36px);
      }

      .intro-panel {
        gap: 18px;
        padding: 0 24px;
      }

      .intro-mark {
        width: 100px;
        height: 100px;
      }

      .intro-title {
        font-size: 13px;
        letter-spacing: 0.2em;
      }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="intro-overlay" aria-hidden="false">
    <div class="intro-panel">
      <div class="intro-mark">
        <div class="intro-mark-inner">
          <div class="intro-crown">♕</div>
          <div class="intro-mark-copy">THE CROWN
PRODUCTION</div>
        </div>
      </div>
      <div class="intro-title">The Crown Production</div>
      <button class="intro-enter" id="intro-enter" type="button">Enter</button>
      <div class="intro-hint">Press Enter</div>
    </div>
  </div>
  <nav id="top-nav">
    <div class="nav-left">
      <div class="nav-brand">ARTIST NAME</div>
      <div class="nav-caption">STORYBOOK VILLAGE EXPERIENCE</div>
    </div>
    <div class="nav-right">
      <button class="nav-btn" id="reset-view">HOME</button>
      <div id="view-nav"></div>
      <button class="nav-btn" id="map-toggle">MAP</button>
    </div>
  </nav>
  <div id="hud-note">Drag to orbit. Click a house to zoom, then confirm.</div>
  <div id="tod-widget" aria-hidden="true">
    <span id="tod-clock"></span>
    <span id="tod-label"></span>
  </div>
  <div id="house-tooltip" aria-hidden="true">
    <span class="house-tooltip-label"></span>
    <span class="house-tooltip-name"></span>
  </div>
  <div id="plot-panel" aria-hidden="true">
    <div class="plot-panel-status"></div>
    <div class="plot-panel-id"></div>
    <div class="plot-panel-title"></div>
    <div class="plot-panel-price"></div>
    <div class="plot-panel-size"></div>
    <div class="plot-panel-desc"></div>
  </div>

  <script type="module" src="./assets/js/main.js"></script>
</body>
</html>
