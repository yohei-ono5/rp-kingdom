<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fantasy House Test</title>
  <style>
    :root {
      --nav-bg: rgba(20, 16, 40, 0.55);
      --nav-bg-hover: rgba(40, 30, 65, 0.75);
      --nav-bg-active: rgba(196, 230, 255, 0.18);
      --nav-border: rgba(255, 220, 140, 0.25);
      --nav-border-active: rgba(170, 225, 255, 0.65);
      --nav-text: #f7eac0;
      --nav-text-active: #d9f5ff;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
    }

    canvas {
      display: block;
    }

    #top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 28px;
      color: #f4ead0;
      font-family: Georgia, serif;
      pointer-events: none;
    }

    #top-nav * {
      pointer-events: auto;
    }

    .nav-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-brand {
      font-size: 18px;
      letter-spacing: 0.08em;
      font-weight: bold;
    }

    .nav-caption {
      font-size: 11px;
      letter-spacing: 0.18em;
      color: rgba(244, 234, 208, 0.7);
    }

    .nav-right {
      display: flex;
      gap: 10px;
    }

    #view-nav {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      background: rgba(20, 16, 40, 0.55);
      color: #f7eac0;
      border: 1px solid rgba(255, 220, 140, 0.25);
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 13px;
      letter-spacing: 0.06em;
      backdrop-filter: blur(8px);
      transition:
        background 180ms ease,
        border-color 180ms ease,
        color 180ms ease,
        transform 180ms ease;
    }

    .nav-btn:hover {
      background: var(--nav-bg-hover);
      transform: translateY(-1px);
    }

    .nav-btn.is-active {
      background: var(--nav-bg-active);
      border-color: var(--nav-border-active);
      color: var(--nav-text-active);
    }

    #hud-note {
      position: fixed;
      left: 28px;
      bottom: 24px;
      z-index: 1200;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(12, 14, 24, 0.35);
      color: rgba(250, 241, 220, 0.82);
      font: 12px/1.4 Georgia, serif;
      letter-spacing: 0.05em;
      backdrop-filter: blur(6px);
      pointer-events: none;
      transition:
        opacity 180ms ease,
        transform 180ms ease;
    }

    #hud-note.is-map {
      color: #d9f5ff;
      border-color: rgba(170, 225, 255, 0.3);
      background: rgba(18, 31, 40, 0.42);
    }

    #house-tooltip {
      position: fixed;
      z-index: 1600;
      min-width: 120px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 220, 140, 0.28);
      background: rgba(20, 16, 40, 0.9);
      color: #fff4d8;
      font-family: Georgia, serif;
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(8px);
      pointer-events: none;
      opacity: 0;
      transform: translate3d(0, 8px, 0) scale(0.98);
      transition:
        opacity 150ms ease,
        transform 150ms ease;
    }

    #house-tooltip.is-visible {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }

    .house-tooltip-label {
      display: block;
      margin-bottom: 2px;
      color: #ffe7a8;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.08em;
    }

    .house-tooltip-name {
      display: block;
      color: rgba(255, 244, 216, 0.76);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 720px) {
      #top-nav {
        padding: 16px 18px;
        align-items: flex-start;
        gap: 14px;
        flex-direction: column;
      }

      .nav-right {
        width: 100%;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .nav-btn {
        white-space: nowrap;
      }

      #hud-note {
        left: 18px;
        right: 18px;
        bottom: 18px;
        border-radius: 18px;
      }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <nav id="top-nav">
    <div class="nav-left">
      <div class="nav-brand">ARTIST NAME</div>
      <div class="nav-caption">STORYBOOK VILLAGE EXPERIENCE</div>
    </div>
    <div class="nav-right">
      <button class="nav-btn" id="reset-view">HOME</button>
      <div id="view-nav"></div>
      <button class="nav-btn" id="map-toggle">MAP</button>
    </div>
  </nav>
  <div id="hud-note">Drag to orbit. Click a house to zoom, then confirm.</div>
  <div id="house-tooltip" aria-hidden="true">
    <span class="house-tooltip-label"></span>
    <span class="house-tooltip-name"></span>
  </div>

  <script type="module" src="./assets/js/main.js"></script>
</body>
</html>
